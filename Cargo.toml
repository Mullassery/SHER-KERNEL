[workspace]
members = [
    # Core primitives (always present)
    "crates/common",
    "crates/objectmodel",
    "crates/security",

    # Bootstrap & core kernel
    "crates/bootstrap",
    "crates/core",
    "crates/runtime",

    # Memory management (lazy after bootstrap)
    "crates/memory",

    # Compute scheduling (lazy per accelerator)
    "crates/compute",

    # Interrupts (essential, minimal)
    "crates/interrupt",

    # Hardware drivers (on-demand)
    "crates/drivers",

    # Compatibility layers (load on demand)
    "crates/compatibility",

    # Optional services
    "crates/services",

    # AI runtime (on-demand)
    "crates/ai",

    # Diagnostics (deferred)
    "crates/diagnostics",

    # Adaptive Resource Orchestrator (ARO)
    "crates/aro",

    # Immutable-first subsystems
    "crates/recovery",
    "crates/snapshot",
    "crates/updater",

    # Main kernel entry
    "crates/kernel", "crates/benchmarks", "crates/digital_twins", "crates/profiling", "crates/hardening", "crates/hal", "crates/gpu_driver", "crates/audio_driver", "crates/input_driver", "crates/wayland_server", "crates/unified_device_manager", "crates/system_integration", "crates/performance_benchmarks", "crates/security_audit", "crates/performance_optimization", "crates/release_engineering",

    # Previously only implicit workspace members (path deps of crates/kernel
    # and others, auto-included by Cargo but not listed here) — made
    # explicit for clarity.
    "crates/device_manager", "crates/driver_runtime", "crates/lki",
    "crates/networking", "crates/scheduler", "crates/storage",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["Georgi Mammen Mullassery <mullassery@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/Mullassery/SHER-Kernel"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
crossbeam-queue = "0.3"

[package]
name = "sher-kernel"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "SHER Kernel - userspace prototype of OS-kernel object-model, scheduling, memory, and driver-lifecycle concepts (not a bootable kernel)"

[[bin]]
name = "sher-kernel"
path = "src/bin/sher-kernel.rs"

[dependencies]
sher_common = { path = "crates/common" }

[profile.release]
opt-level = 3
lto = true
