[workspace]
members = [
    # Core primitives (always present)
    "crates/common",
    "crates/objectmodel",
    "crates/security",

    # Bootstrap & core kernel
    "crates/bootstrap",
    "crates/core",
    "crates/runtime",

    # Memory management (lazy after bootstrap)
    "crates/memory",

    # Compute scheduling (lazy per accelerator)
    "crates/compute",

    # Interrupts (essential, minimal)
    "crates/interrupt",

    # Hardware drivers (on-demand)
    "crates/drivers",

    # Compatibility layers (load on demand)
    "crates/compatibility",

    # Optional services
    "crates/services",

    # AI runtime (on-demand)
    "crates/ai",

    # Diagnostics (deferred)
    "crates/diagnostics",

    # Adaptive Resource Orchestrator (ARO)
    "crates/aro",

    # Immutable-first subsystems
    "crates/recovery",
    "crates/snapshot",
    "crates/updater",

    # Main kernel entry
    "crates/kernel",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Georgi Mammen Mullassery <mullassery@gmail.com>"]
license = "Proprietary License — Free to use with explicit attribution"
repository = "https://github.com/Mullassery/SHER-Kernel"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
opt-level = 3
lto = true
