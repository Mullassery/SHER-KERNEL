name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt -- --check

      - name: cargo build (all targets, including examples and benches)
        run: cargo build --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace

      # Deliberately not --all-targets: clippy over test/bench code surfaces
      # a batch of real, pre-existing warnings (e.g. clone_on_copy on
      # ObjectId) in code this pass didn't touch. --workspace (lib/bin
      # targets) is the actual, currently-clean bar documented in the
      # README/CLAUDE.md; widening this to --all-targets is real, separate
      # follow-up work, not something to silently bundle into a CI-adding
      # commit.
      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings
