name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: build + test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ matrix.arch }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt -- --check

      - name: cargo build (all targets, including examples and benches)
        run: cargo build --workspace --all-targets --all-features

      - name: cargo test
        run: cargo test --workspace --all-features

      # Re-verified 2026-10: the test/bench clippy warnings this used to
      # carve around (clone_on_copy on ObjectId, etc.) are gone from the
      # current tree, so this now covers the full workspace including
      # test/bench targets rather than silently exempting them.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
